# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: windows-latest

    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Restore dependencies
      run: dotnet restore SimCineCapture.slnx
    - name: Build
      run: dotnet build SimCineCapture.slnx --configuration Release --no-restore
    # - name: Test
    #   run: dotnet test SimCineCapture.slnx --configuration Release --no-build --verbosity normal
